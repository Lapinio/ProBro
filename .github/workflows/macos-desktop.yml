name: macOS desktop (VNC)

# Starts a macOS runner with Xcode and exposes its desktop over VNC inside your
# private Tailscale network, so you can use it from Windows like a remote Mac.
# Without the TAILSCALE_AUTHKEY secret it only runs a self-check and stops.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep the desktop alive (max 350)"
        default: "120"
        required: true

jobs:
  desktop:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Prepare project
        run: make project

      - name: Enable Screen Sharing (VNC)
        run: |
          if [ -z "$VNC_PASSWORD" ]; then
            if [ -n "$TAILSCALE_AUTHKEY" ]; then
              echo "::error::Set the VNC_PASSWORD secret (up to 8 characters) before using the desktop."
              exit 1
            fi
            VNC_PASSWORD="$(openssl rand -hex 4)"
          fi
          # Same password for the macOS user "runner" (login, sudo, Keychain prompts), if the image allows it.
          sudo sysadminctl -resetPasswordFor runner -newPassword "$VNC_PASSWORD" 2>&1 \
            || echo "::warning::Could not set the runner user password; VNC still works with VNC_PASSWORD."
          kickstart=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          sudo "$kickstart" -configure -allowAccessFor -allUsers -privs -all
          sudo "$kickstart" -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$VNC_PASSWORD"
          sudo "$kickstart" -activate -configure -access -on -restart -agent -console
          echo "VNC_PASSWORD=$VNC_PASSWORD" >> "$GITHUB_ENV"

      - name: Self-check (connect over VNC and grab a frame)
        run: |
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 5900 && break
            sleep 2
          done
          nc -z 127.0.0.1 5900 || { echo "::error::VNC server is not listening on port 5900"; exit 1; }
          python3 -m venv "$RUNNER_TEMP/vnc"
          "$RUNNER_TEMP/vnc/bin/pip" install -q vncdotool pillow
          mkdir -p build
          "$RUNNER_TEMP/vnc/bin/vncdo" -s 127.0.0.1::5900 -p "$VNC_PASSWORD" --timeout 60 capture build/desktop.png
          "$RUNNER_TEMP/vnc/bin/python" - <<'EOF'
          from PIL import Image
          img = Image.open("build/desktop.png").convert("L")
          lo, hi = img.getextrema()
          print(f"VNC frame {img.size[0]}x{img.size[1]}, brightness range {lo}..{hi}")
          if hi - lo < 10:
              raise SystemExit("::error::VNC frame is blank: screen recording is blocked for Screen Sharing")
          print("VNC shows the desktop")
          EOF

      - name: Upload desktop screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-screenshot
          path: build/desktop.png
          if-no-files-found: warn

      - name: Connect to Tailscale
        if: env.TAILSCALE_AUTHKEY != ''
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: probro-mac-${{ github.run_number }}

      - name: Keep desktop alive
        if: env.TAILSCALE_AUTHKEY != ''
        env:
          MINUTES: ${{ github.event.inputs.minutes }}
        run: |
          host="probro-mac-${{ github.run_number }}"
          ip="$(tailscale ip -4 2>/dev/null | head -1 || true)"
          echo "================================================================"
          echo " Open your VNC viewer on Windows and connect to:"
          echo "   ${ip:-$host}:5900   (or ${host}:5900)"
          echo " Password: your VNC_PASSWORD secret. macOS user: runner"
          echo " To finish early, create a file named STOP on the Mac desktop."
          echo "================================================================"
          end=$(( $(date +%s) + MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$end" ] && [ ! -f "$HOME/Desktop/STOP" ]; do
            sleep 30
          done

      - name: Explain how to enable the desktop
        if: env.TAILSCALE_AUTHKEY == ''
        run: |
          echo "::notice::Self-check passed. Add the TAILSCALE_AUTHKEY and VNC_PASSWORD secrets to use the desktop (see README)."
