name: ProBro
options:
  bundleIdPrefix: com.lapinio
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"

targets:
  ProBro:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - App/Sources
      - App/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lapinio.probro
        PRODUCT_NAME: ProBro
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ProBro
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/ProBro-macOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"

  ProBroTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - Tests
    dependencies:
      - target: ProBro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lapinio.probro.tests
        GENERATE_INFOPLIST_FILE: YES
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/ProBro.app/Contents/MacOS/ProBro"
        "TEST_HOST[sdk=iphone*]": "$(BUILT_PRODUCTS_DIR)/ProBro.app/ProBro"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ProBro:
    build:
      targets:
        ProBro: all
        ProBroTests: [test]
    test:
      targets:
        - ProBroTests
    archive:
      config: Release
